name: Episode Shorts Upload (YouTube + TikTok + Instagram)

# 綾城マキ 本編エピソードのショートを、キューから1本ずつ自動投稿する。
# ペース: 土・日・水・金 の 18:30 JST（本編を投稿した土曜から Sat→Sun→Wed→Fri で a,b,c,d を消化）。
# キューが空 or 消化済みなら何も投稿しない（撮り溜め回が先走らない安全設計）。
# キュー投入は `node scripts/episode-enqueue.js <話数>` をローカルで実行→コミット。

on:
  schedule:
    - cron: '30 9 * * 0,3,5,6'  # Sat/Sun/Wed/Fri 09:30 UTC = 18:30 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Write credentials
        run: |
          echo "YOUTUBE_CLIENT_ID=${{ secrets.YOUTUBE_CLIENT_ID }}" >> .env
          echo "YOUTUBE_CLIENT_SECRET=${{ secrets.YOUTUBE_CLIENT_SECRET }}" >> .env
          echo "TIKTOK_CLIENT_KEY=${{ secrets.TIKTOK_CLIENT_KEY }}" >> .env
          echo "TIKTOK_CLIENT_SECRET=${{ secrets.TIKTOK_CLIENT_SECRET }}" >> .env
          echo '${{ secrets.YOUTUBE_TOKEN }}' > .youtube-token.json
          if [ -n '${{ secrets.TIKTOK_TOKEN }}' ]; then
            echo '${{ secrets.TIKTOK_TOKEN }}' > .tiktok-token.json
          fi

      - name: Prepare next short from queue
        id: prepare
        run: node scripts/episode-prepare.js

      - name: Upload to YouTube
        if: steps.prepare.outputs.pending == 'true'
        run: node scripts/upload-youtube.js

      - name: Upload to TikTok
        if: steps.prepare.outputs.pending == 'true'
        continue-on-error: true
        run: node scripts/upload-tiktok.js

      - name: Upload to Instagram
        if: steps.prepare.outputs.pending == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: node scripts/upload-instagram.js

      - name: Advance queue pointer and commit
        if: steps.prepare.outputs.pending == 'true'
        run: |
          node -e "const fs=require('fs');const p='episode-shorts/state.json';const s=JSON.parse(fs.readFileSync(p));s.nextIndex=(s.nextIndex||0)+1;fs.writeFileSync(p,JSON.stringify(s,null,2)+'\n');"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add episode-shorts/state.json
          git commit -m "chore(shorts): advance episode-shorts queue pointer [skip ci]"
          git push origin HEAD:main

      - name: Save refreshed tokens to GitHub Secrets
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -f .youtube-token.json ]; then
            gh secret set YOUTUBE_TOKEN \
              --repo whoamiinc-creation/whoami-studio-movie-creation \
              --body "$(cat .youtube-token.json)"
            echo "YOUTUBE_TOKEN updated."
          fi
          if [ -f .tiktok-token.json ]; then
            gh secret set TIKTOK_TOKEN \
              --repo whoamiinc-creation/whoami-studio-movie-creation \
              --body "$(cat .tiktok-token.json)"
            echo "TIKTOK_TOKEN updated."
          fi
